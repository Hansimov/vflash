name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ensure media executables
        timeout-minutes: 5
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - run: python -m pip install -e '.[dev,server,restoration]'
      - run: pre-commit run --all-files
      - run: pytest
      - name: Install CPU tensor runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0
          python -m pip install "safetensors>=0.8.0rc0,<0.9"
      - name: Run CPU tensor regressions
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: pytest tests/test_audio_headroom.py tests/test_face_encoder.py tests/test_h3_refinement.py tests/test_h3_veda_attention.py tests/test_clip_reuse.py tests/test_rgb_delivery.py tests/test_selective_decode.py
