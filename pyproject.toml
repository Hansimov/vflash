[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vflash"
version = "0.1.0a3"
description = "A hardware-specialized MiniMax H3 inference engine for RTX 3080 and RTX 4090"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Vflash contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
]
dependencies = []

[project.optional-dependencies]
gpu = [
  "numpy>=2.3,<2.4",
  "safetensors>=0.8.0rc0,<0.9",
  "torch>=2.11,<2.12",
  "triton>=3.6,<3.7",
]
server = ["fastapi>=0.136,<0.137", "uvicorn>=0.47,<0.48"]
dev = ["httpx>=0.28,<0.29", "pre-commit>=4.0", "pytest>=8.3", "ruff>=0.12"]

[project.scripts]
vflash = "vflash.cli:main"

[project.urls]
Homepage = "https://github.com/Hansimov/vflash"
Documentation = "https://hansimov.github.io/vflash/"
Repository = "https://github.com/Hansimov/vflash"

[tool.hatch.build.targets.wheel]
packages = ["src/vflash"]

[tool.hatch.build]
include = ["src/vflash/**/*.py", "src/vflash/data/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
